# Formal release on an immutable version tag (v*). Refuses to publish when the
# tag does not match the workspace version, when a release already exists, or
# when any platform package fails qualification. Creates exactly one release.
name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: Verify tag, gates, and no existing release
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches workspace version
        run: bash scripts/package/version.sh --check-tag "$GITHUB_REF_NAME"
      - name: Refuse to overwrite an existing release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "error: release $GITHUB_REF_NAME already exists; refusing to publish a duplicate" >&2
            exit 1
          fi
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.92.0 --profile minimal -c rustfmt -c clippy
          rustup default 1.92.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  package:
    needs: verify
    uses: ./.github/workflows/package.yml
    with:
      publish_name: release

  publish:
    name: Publish one coherent GitHub Release
    needs: [verify, package]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - name: Download every platform package (one directory per platform)
        uses: actions/download-artifact@v4
        with:
          pattern: context-kernel-*-release-${{ github.sha }}-*
          path: assets
          merge-multiple: false
      - name: Verify each platform's checksums, then assemble one release set
        run: |
          set -euo pipefail
          for d in assets/*/; do
            (cd "$d" && sha256sum -c SHA256SUMS)
          done
          mkdir -p release
          for d in assets/*/; do
            for f in "$d"*; do
              [ "$(basename "$f")" = "SHA256SUMS" ] && continue
              mv "$f" release/
            done
            cat "$d/SHA256SUMS" >> release/SHA256SUMS.parts
          done
          sort -u release/SHA256SUMS.parts > release/SHA256SUMS
          rm release/SHA256SUMS.parts
          (cd release && sha256sum -c SHA256SUMS)
          # Exactly the declared matrix: linux x2 arches (tar+deb), windows (zip+setup),
          # macOS x2 arches (pkg+dmg) = 10 assets, plus SHA256SUMS.
          count=$(ls release | grep -vc '^SHA256SUMS$')
          echo "release assets: $count"
          test "$count" -eq 10
          ls -l release
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            release/*.tar.gz
            release/*.deb
            release/*.zip
            release/*-setup.exe
            release/*.pkg
            release/*.dmg
      - name: Create the release (single call, from verified assets)
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: release
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "Context Kernel $GITHUB_REF_NAME" \
            --notes "Native packages for Linux (x86_64, arm64), Windows (x86_64), and macOS (arm64, x86_64). Windows binaries and installer are unsigned. macOS packages are unsigned and not notarized. Verify with SHA256SUMS and the build provenance attestations." \
            ./*.tar.gz ./*.deb ./*.zip ./*-setup.exe ./*.pkg ./*.dmg ./SHA256SUMS

  # crates.io is a separate channel. It runs beside the native release, not after
  # it, so one channel's failure never hides the other's result.
  publish-crates:
    name: Publish context-kernel crates to crates.io
    needs: verify
    runs-on: ubuntu-22.04
    # Waits out crates.io new-crate rate limits between crates; bounded by this timeout.
    timeout-minutes: 300
    permissions:
      contents: read
    env:
      CK_CRATE_RECEIPTS: ${{ github.workspace }}/dist/crates-receipts
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.92.0 --profile minimal
          rustup default 1.92.0
      - uses: Swatinem/rust-cache@v2
      - name: Validate the publishable set and dry-run every crate (no credentials)
        run: bash scripts/package/crates/publish.sh --check
      - name: Publish missing crates in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: bash scripts/package/crates/publish.sh --publish
      - name: Upload crates.io publication receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crates-receipts-${{ github.ref_name }}
          path: dist/crates-receipts/
          if-no-files-found: warn
          retention-days: 90

  verify-crates-install:
    name: Install from crates.io and qualify (${{ matrix.runner }})
    needs: publish-crates
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-22.04, ubuntu-22.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.92.0 --profile minimal
          rustup default 1.92.0
      - name: Install context-kernel from crates.io into an empty root
        run: |
          set -euo pipefail
          version="$(bash scripts/package/version.sh)"
          root="$(mktemp -d)"
          # The index can lag a few minutes behind a fresh publish.
          for attempt in $(seq 1 30); do
            if cargo install context-kernel --version "=$version" --locked --root "$root"; then break; fi
            test "$attempt" -lt 30 || exit 1
            sleep 20
          done
          bin="$root/bin/context-kernal"
          test -x "$bin"
          test "$("$bin" --version | awk '{print $NF}')" = "$version"
          echo "CK_QUALIFY_BIN=$bin" >> "$GITHUB_ENV"
          echo "CK_QUALIFY_VERSION=$version" >> "$GITHUB_ENV"
      - name: Qualify the crates.io binary with the installed-binary suite
        run: cargo test --release -p context-kernel --test installed_package

  channel-report:
    name: Report each distribution channel
    if: always()
    needs: [publish, publish-crates, verify-crates-install]
    runs-on: ubuntu-22.04
    permissions: {}
    steps:
      - name: Record and enforce each channel's result
        env:
          NATIVE: ${{ needs.publish.result }}
          CRATES: ${{ needs.publish-crates.result }}
          CRATES_INSTALL: ${{ needs.verify-crates-install.result }}
        run: |
          {
            echo "## Release channel results for $GITHUB_REF_NAME"
            echo ""
            echo "| Channel | Result |"
            echo "| --- | --- |"
            echo "| GitHub Release (native packages) | $NATIVE |"
            echo "| crates.io publication | $CRATES |"
            echo "| crates.io install and qualification | $CRATES_INSTALL |"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "native=$NATIVE crates=$CRATES crates_install=$CRATES_INSTALL"
          if [ "$NATIVE" != success ] || [ "$CRATES" != success ] || [ "$CRATES_INSTALL" != success ]; then
            echo "error: at least one channel did not succeed; see the summary" >&2
            exit 1
          fi
