[workspace]
members = [
  "crates/ck-core",
  "crates/ck-config",
  "crates/ck-storage-sqlite",
  "crates/ck-search-fts",
  "crates/ck-artifacts",
  "crates/ck-ranker",
  "crates/ck-adapter-filesystem",
  "crates/ck-app",
  "crates/ck-mcp",
  "crates/ck-transport-stdio",
  "crates/ck-bin",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
version = "0.1.0"

[workspace.dependencies]
anyhow = "1"
assert_cmd = "2"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
hex = "0.4"
predicates = "3"
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
thiserror = "1"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
ulid = { version = "1", features = ["serde"] }
