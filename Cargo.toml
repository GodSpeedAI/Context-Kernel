[workspace]
members = [
  "crates/ck-core",
  "crates/ck-config",
  "crates/ck-storage-sqlite",
  "crates/ck-search-fts",
  "crates/ck-artifacts",
  "crates/ck-ranker",
  "crates/ck-adapter-filesystem",
  "crates/ck-app",
  "crates/ck-mcp",
  "crates/ck-transport-stdio",
  "crates/ck-transport-sse",
  "crates/ck-auth",
  "crates/ck-scheduler",
  "crates/ck-bin",
  "crates/ck-embeddings",
  "crates/ck-vector",
  "crates/ck-adapter-github",
  "crates/ck-adapter-web",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
version = "0.1.0"

[workspace.dependencies]
anyhow = "1"
assert_cmd = "2"
axum = "0.7"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
hex = "0.4"
http-body-util = "0.1"
hyper = "1"
predicates = "3"
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
tempfile = "3"
thiserror = "1"
tokio = { version = "1", features = ["full"] }
toml = "0.8"
tower = "0.5"
tracing = "0.1"
ureq = { version = "2", features = ["json"] }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
ulid = { version = "1", features = ["serde"] }
url = "2"
percent-encoding = "2"
